<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="description" content="AYMP Mystic 3D Quest - a captivating magical cosmic adventure with original heroes and creatures."><title>AYMP Mystic 3D Quest</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#02030b;color:#fff;font-family:system-ui}body{display:grid;place-items:center}.game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#02030b}.scene{position:absolute;inset:0;background:radial-gradient(circle at 50% 25%,#4b2b9b 0,#10154b 38%,#02030b 100%)}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;z-index:5;top:10px;left:10px;right:10px;display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:18px;background:rgba(3,5,24,.84);border:1px solid rgba(255,215,0,.45);font-weight:900;font-size:12px}.controls{position:absolute;z-index:6;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:8px}.controls button{width:55px;height:48px;border:1px solid rgba(255,215,0,.55);border-radius:17px;background:rgba(4,7,28,.9);color:#ffd700;font-size:21px;font-weight:900}.controls .shoot{width:105px;background:rgba(120,25,120,.88)}.overlay{position:absolute;z-index:10;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.56);padding:18px;text-align:center}.panel{width:min(90vw,470px);padding:24px;border-radius:25px;background:rgba(5,7,27,.97);border:1px solid rgba(255,215,0,.55);box-shadow:0 15px 70px #000}.panel h1{margin:0 0 8px;color:#ffd700;font:700 32px Georgia,serif}.panel p{color:#ddd;line-height:1.55}.start{padding:13px 22px;border:0;border-radius:27px;background:#d4af37;color:#111;font-weight:1000;font-size:16px}.hint{font-size:12px;color:#aaa;margin-top:10px}.tag{color:#9ff;font-weight:900}</style></head><body><div class="game"><div class="scene"><canvas id="c" width="1000" height="700"></canvas></div><div class="hud"><span class="pill">🌌 MYSTIC 3D QUEST</span><span class="pill" id="score">💎 0</span><span class="pill" id="best">🏆 0</span><span class="pill" id="life">❤️ 3</span><span class="pill" id="level">REALM 1</span></div><div class="controls"><button data-k="left">◀</button><button data-k="up">▲</button><button data-k="down">▼</button><button data-k="right">▶</button><button class="shoot" id="shoot">✨ CAST</button></div><div class="overlay" id="o"><div class="panel"><h1>🌌 AYMP Mystic 3D Quest</h1><p>Meet the <span class="tag">Mystic Guardian</span> and magical creatures of an original cosmic realm. Collect crystals, avoid guardians and cast energy to survive.</p><button class="start" id="start">▶ ENTER THE MYSTIC WORLD</button><div class="hint">Swipe left/right • Arrow buttons • Tap CAST</div></div></div></div><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),o=document.getElementById('o');let score=0,best=+localStorage.getItem('aymp-mystic-best')||0,life=3,level=1,running=false,t=0,last=0,px=0,targets=[],bolts=[],parts=[],audio=null,sound=true;document.getElementById('best').textContent='🏆 '+best;function tone(f){if(!sound)return;try{audio=audio||new(AudioContext||webkitAudioContext)();let q=audio.createOscillator(),a=audio.createGain();q.frequency.value=f;a.gain.value=.035;q.connect(a);a.connect(audio.destination);q.start();q.stop(audio.currentTime+.07)}catch(e){}}function start(){score=0;life=3;level=1;px=0;targets=[];bolts=[];parts=[];running=true;o.style.display='none';for(let i=0;i<9;i++)spawn(i);last=performance.now();requestAnimationFrame(loop)}function spawn(i){let r=Math.random();targets.push({x:(Math.random()*2-1)*.82,z:3+i*.85+Math.random()*2,type:r<.2?'dragon':r<.38?'sprite':r<.57?'crystal':'orb',phase:Math.random()*7,spin:Math.random()*7})}function burst(xx,yy,n=18){for(let i=0;i<n;i++)parts.push({x:xx,y:yy,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,a:1})}function cast(){if(!running)return;bolts.push({x:px,z:.85});burst(500+px*150,555,8);tone(780)}function move(k){if(!running)return;if(k==='left')px=Math.max(-.88,px-.11);if(k==='right')px=Math.min(.88,px+.11)}function hud(){document.getElementById('score').textContent='💎 '+score;document.getElementById('best').textContent='🏆 '+best;document.getElementById('life').textContent='❤️ '+life;document.getElementById('level').textContent='REALM '+level}function proj(z){return 1/(z+.32)}function hero(xx,yy,s){x.save();x.translate(xx,yy);let bob=Math.sin(t*.09)*3*s;x.translate(0,bob);x.shadowBlur=30;x.shadowColor='#52eaff';x.fillStyle='#18234f';x.beginPath();x.moveTo(-28*s,70*s);x.lineTo(-18*s,0);x.lineTo(18*s,0);x.lineTo(28*s,70*s);x.closePath();x.fill();x.shadowBlur=0;x.fillStyle='#ffd7bb';x.beginPath();x.arc(0,-24*s,16*s,0,7);x.fill();x.fillStyle='#1b1635';x.beginPath();x.arc(0,-31*s,17*s,Math.PI,0);x.fill();x.fillStyle='#d4af37';x.fillRect(-23*s,0,46*s,6*s);x.strokeStyle='#74f6ff';x.lineWidth=5*s;x.beginPath();x.moveTo(24*s,5*s);x.lineTo(48*s,-38*s);x.stroke();x.fillStyle='#9ff';x.shadowBlur=22;x.shadowColor='#8ff';x.beginPath();x.arc(49*s,-40*s,7*s,0,7);x.fill();x.restore()}function creature(a,sx,sy,r){x.save();x.translate(sx,sy);let bob=Math.sin(t*.08+a.phase)*7*sx*0+Math.sin(t*.08+a.phase)*6*(1/a.z);x.translate(0,bob);x.rotate(Math.sin(t*.04+a.phase)*.12);x.shadowBlur=28;if(a.type==='dragon'){x.shadowColor='#d54cff';x.fillStyle='#4b2378';x.beginPath();x.ellipse(0,0,r*1.1,r*.62,0,0,7);x.fill();x.fillStyle='#8b4bd6';x.beginPath();x.moveTo(-r*.45,-r*.2);x.lineTo(-r*1.35,-r*.95);x.lineTo(-r*.72,r*.05);x.closePath();x.fill();x.beginPath();x.moveTo(r*.45,-r*.2);x.lineTo(r*1.35,-r*.95);x.lineTo(r*.72,r*.05);x.closePath();x.fill();x.fillStyle='#ffd95a';x.beginPath();x.arc(r*.55,-r*.05,r*.15,0,7);x.fill()}else if(a.type==='sprite'){x.shadowColor='#61f5ff';x.fillStyle='#a9fbff';x.beginPath();x.arc(0,0,r*.65,0,7);x.fill();x.fillStyle='#23316d';x.beginPath();x.arc(-r*.2,-r*.08,r*.08,0,7);x.arc(r*.2,-r*.08,r*.08,0,7);x.fill();x.fillStyle='#c9f';x.beginPath();x.moveTo(-r*.45,r*.35);x.lineTo(-r*1.1,-r*.3);x.lineTo(-r*.55,-r*.55);x.closePath();x.fill();x.beginPath();x.moveTo(r*.45,r*.35);x.lineTo(r*1.1,-r*.3);x.lineTo(r*.55,-r*.55);x.closePath();x.fill()}else{x.shadowColor='#72f8ff';x.fillStyle='#71eaff';x.beginPath();x.moveTo(0,-r);x.lineTo(r*.55,0);x.lineTo(0,r);x.lineTo(-r*.55,0);x.closePath();x.fill()}x.restore()}function draw(){x.clearRect(0,0,1000,700);let bg=x.createLinearGradient(0,0,0,700);bg.addColorStop(0,'#18155d');bg.addColorStop(.55,'#090b2e');bg.addColorStop(1,'#02030b');x.fillStyle=bg;x.fillRect(0,0,1000,700);for(let i=0;i<120;i++){let sx=(i*83-t*.22)%1000;if(sx<0)sx+=1000;let sy=(i*47)%370+15;x.globalAlpha=.25+(i%5)*.1;x.fillStyle='#fff';x.fillRect(sx,sy,2,2)}x.globalAlpha=1;for(let i=0;i<6;i++){let mx=(i*210-t*.08)%1200-100;x.fillStyle='rgba(92,65,210,.18)';x.beginPath();x.arc(mx,220+(i%3)*35,105+i*8,0,7);x.fill()}// distant palace and moon
x.fillStyle='rgba(212,175,55,.22)';x.beginPath();x.arc(790,135,54,0,7);x.fill();x.fillStyle='#273078';x.fillRect(420,235,160,125);x.fillStyle='#d4af37';x.beginPath();x.moveTo(500,125);x.lineTo(448,235);x.lineTo(552,235);x.closePath();x.fill();x.fillStyle='#111844';x.fillRect(472,282,56,78);for(let i=0;i<3;i++){x.fillStyle='#76f6ff';x.fillRect(438+i*52,260,17,28)}// road
x.fillStyle='#08091e';x.beginPath();x.moveTo(150,700);x.lineTo(850,700);x.lineTo(560,365);x.lineTo(440,365);x.closePath();x.fill();x.strokeStyle='rgba(212,175,55,.45)';x.lineWidth=3;x.beginPath();x.moveTo(150,700);x.lineTo(440,365);x.moveTo(850,700);x.lineTo(560,365);x.stroke();for(let i=0;i<7;i++){let yy=390+i*i*8;x.strokeStyle='rgba(96,240,255,.16)';x.beginPath();x.moveTo(500-(yy-365)*.85,yy);x.lineTo(500+(yy-365)*.85,yy);x.stroke()}targets.forEach(a=>{a.z-=.015*(level+.45);let s=proj(a.z),sx=500+a.x*520*s,sy=365+(1-s)*285;if(a.z<.55){if(a.type==='dragon'){life--;tone(130);burst(500+px*150,540,24)}else{score+=a.type==='crystal'?25:10;burst(sx,sy,12);tone(a.type==='crystal'?920:620)}if(score>best){best=score;localStorage.setItem('aymp-mystic-best',best)}a.z=5+Math.random()*2;a.x=(Math.random()*2-1)*.85}let r=Math.max(10,55*s);creature(a,sx,sy,r)});bolts.forEach(b=>{b.z+=.22;let s=proj(b.z),sx=500+(b.x-px)*430*s,sy=540-(1-s)*170;x.fillStyle='#9ff';x.shadowBlur=30;x.shadowColor='#6ff';x.beginPath();x.arc(sx,sy,7+13*s,0,7);x.fill();x.shadowBlur=0});hero(500+px*150,520,1.2);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.a-=.035;x.globalAlpha=Math.max(0,p.a);x.fillStyle='#9ff';x.fillRect(p.x,p.y,4,4)});x.globalAlpha=1}function update(){bolts.forEach(b=>{targets.forEach(a=>{if(Math.abs(a.z-b.z)<.2&&Math.abs(a.x-b.x)<.2){a.z=5+Math.random()*2;a.x=(Math.random()*2-1)*.85;score+=a.type==='dragon'?50:a.type==='crystal'?25:10;burst(500+a.x*220,350,20);tone(1050);if(score>best){best=score;localStorage.setItem('aymp-mystic-best',best)}}})});bolts=bolts.filter(b=>b.z<5);parts=parts.filter(p=>p.a>0);level=Math.min(10,1+Math.floor(score/100));hud()}function end(){running=false;o.style.display='grid';o.querySelector('.panel').innerHTML='<h1>🌌 Realm Resting</h1><p>Score: <b>'+score+'</b> • Best: <b>'+best+'</b></p><button class="start" id="again">↻ PLAY AGAIN</button>';document.getElementById('again').onclick=start}function loop(now){if(!running)return;last=now;update();draw();if(life<=0)return end();requestAnimationFrame(loop)}document.getElementById('start').onclick=start;document.getElementById('shoot').onclick=cast;document.querySelectorAll('.controls button[data-k]').forEach(b=>b.onclick=()=>move(b.dataset.k));addEventListener('keydown',e=>{if(e.code==='Space')cast();if(e.key==='ArrowLeft')move('left');if(e.key==='ArrowRight')move('right')});let sx=0;c.addEventListener('pointerdown',e=>sx=e.clientX);c.addEventListener('pointerup',e=>{let dx=e.clientX-sx;if(Math.abs(dx)>25)move(dx<0?'left':'right');else cast()});addEventListener('resize',()=>{});draw()})();</script></body></html>
