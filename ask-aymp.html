<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ask AYMP | Global Questions & Answers</title><meta name="description" content="Ask AYMP a question and explore answers from live public knowledge sources."><style>body{margin:0;background:#050816;color:#fff;font-family:system-ui}.wrap{max-width:850px;margin:auto;padding:25px 16px 60px}.hero{text-align:center;padding:25px 0}.hero h1{font:700 42px Georgia;color:#ffd700}.hero p{color:#ccc;line-height:1.7}.search{display:flex;gap:10px}.search input{flex:1;padding:15px;border-radius:15px;border:1px solid #555;background:#10162d;color:#fff;font-size:16px}.search button{padding:14px 18px;border:0;border-radius:15px;background:#d8b63f;font-weight:900}.card{margin-top:20px;padding:20px;border:1px solid #3d4c8a;border-radius:20px;background:#0b1026;line-height:1.7}.muted{color:#aaa;font-size:13px}.links a{color:#ffd95a}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.chip{padding:8px 12px;border-radius:18px;background:#151d3d;color:#ddd;cursor:pointer}</style></head><body><main class="wrap"><section class="hero"><div>🧠🌍 AYMP KNOWLEDGE</div><h1>Ask AYMP</h1><p>Ask about people, places, science, history, technology, food, nature, space and more. AYMP searches live public knowledge and presents a simple answer.</p></section><div class="search"><input id="q" placeholder="Ask anything… e.g. What is blockchain?"/><button id="go">ASK</button></div><div class="chips"><span class="chip">🌌 Space</span><span class="chip">🤖 AI</span><span class="chip">🔬 Science</span><span class="chip">🌍 Countries</span><span class="chip">🍜 Food</span></div><section id="out" class="card"><strong>Ready.</strong><p>Type a question above to begin.</p></section></main><script>const q=document.getElementById('q'),out=document.getElementById('out');async function ask(){const term=q.value.trim();if(!term)return;out.innerHTML='<strong>🔎 Searching live knowledge…</strong><p>Please wait a moment.</p>';try{const r=await fetch('https://en.wikipedia.org/w/api.php?action=query&origin=*&format=json&prop=extracts&exintro=1&explaintext=1&redirects=1&titles='+encodeURIComponent(term));const d=await r.json();const pages=d.query.pages;const p=pages[Object.keys(pages)[0]];if(!p||p.missing){out.innerHTML='<strong>🔎 No direct article found.</strong><p>Try a more specific question or topic.</p>';return}const text=(p.extract||'').trim();out.innerHTML='<h2>🌍 '+p.title+'</h2><p>'+escapeHtml(text||'No summary available.')+'</p><p class="muted">Source: Wikipedia public knowledge. For medical, legal, financial or other high-stakes questions, verify with a qualified professional.</p>'}catch(e){out.innerHTML='<strong>⚠️ Live answer service is temporarily unavailable.</strong><p>Please try again shortly.</p>'}}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('go').onclick=ask;q.addEventListener('keydown',e=>{if(e.key==='Enter')ask()});document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{q.value=c.textContent.replace(/^\S+\s/,'');ask()})</script></body></html>
