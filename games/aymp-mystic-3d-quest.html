<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AYMP Mystic Crystal Quest</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030b;font-family:system-ui;color:#fff}.game{position:relative;width:100vw;height:100dvh;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.hud{position:absolute;z-index:3;top:10px;left:10px;right:10px;display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.pill{padding:7px 11px;border-radius:18px;background:#05081ddd;border:1px solid #d4af37aa;font-size:12px;font-weight:900}.help{position:absolute;z-index:3;top:55px;left:50%;transform:translateX(-50%);font-size:12px;color:#dfe5ff;text-align:center;white-space:nowrap}.controls{position:absolute;z-index:4;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:9px}.controls button{width:58px;height:50px;border-radius:17px;border:1px solid #d4af37aa;background:#05081dee;color:#ffd95a;font-size:22px;font-weight:900}.controls .cast{width:105px;background:#4d1769ee}.overlay{position:absolute;z-index:10;inset:0;display:grid;place-items:center;background:#01020bd9;text-align:center;padding:18px}.panel{width:min(90vw,460px);padding:25px;border-radius:25px;background:#070a25f7;border:1px solid #d4af37aa;box-shadow:0 15px 70px #000}.panel h1{margin:0 0 10px;color:#ffd700;font:700 32px Georgia,serif}.panel p{line-height:1.55;color:#dce0f4}.start{padding:13px 24px;border:0;border-radius:28px;background:#d4af37;color:#111;font-weight:1000;font-size:16px}</style></head><body><div class="game"><canvas id="c"></canvas><div class="hud"><span class="pill">🌌 MYSTIC CRYSTAL QUEST</span><span class="pill" id="goal">💎 0 / 10</span><span class="pill" id="score">⭐ 0</span><span class="pill" id="life">❤️ 3</span></div><div class="help">💎 COLLECT 10 CRYSTALS • ✨ CAST TO DEFEAT GUARDIANS</div><div class="controls"><button data-m="left">◀</button><button data-m="right">▶</button><button class="cast" id="cast">✨ CAST</button></div><div class="overlay" id="overlay"><div class="panel"><h1>🌌 Mystic Crystal Quest</h1><p><b>Your mission is simple:</b><br>💎 Collect 10 crystals.<br>👹 Cast magic at the guardians.<br>❤️ Avoid collisions.<br>🏆 Complete the realm!</p><button class="start" id="start">▶ START QUEST</button></div></div></div><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),o=document.getElementById('overlay');let W,H,dpr=1,run=false,t=0,px=0,crystals=[],guardians=[],shots=[],particles=[],got=0,score=0,lives=3,last=0;function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}function hud(){goal.textContent='💎 '+got+' / 10';document.getElementById('score').textContent='⭐ '+score;life.textContent='❤️ '+lives}function spawn(){crystals=[];guardians=[];for(let i=0;i<10;i++)crystals.push({x:(Math.random()*2-1)*.8,z:1.5+i*.8});for(let i=0;i<5;i++)guardians.push({x:(Math.random()*2-1)*.8,z:2+i*1.5,phase:Math.random()*6})}function start(){got=0;score=0;lives=3;px=0;shots=[];particles=[];spawn();run=true;o.style.display='none';last=performance.now();requestAnimationFrame(loop)}function move(v){px=Math.max(-.82,Math.min(.82,px+v))}function cast(){if(!run)return;shots.push({x:px,z:.5});burst(W/2+px*W*.32,H*.77,8);tone(760)}function tone(f){try{let a=new AudioContext(),q=a.createOscillator(),g=a.createGain();q.frequency.value=f;g.gain.value=.025;q.connect(g);g.connect(a.destination);q.start();q.stop(a.currentTime+.07)}catch(e){}}function burst(xx,yy,n){for(let i=0;i<n;i++)particles.push({x:xx,y:yy,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,a:1})}function project(z){return 1/(z+.45)}function drawHero(xx,yy){x.save();x.translate(xx,yy+Math.sin(t*.08)*3);x.shadowBlur=28;x.shadowColor='#58eaff';x.fillStyle='#202b63';x.beginPath();x.moveTo(-28,52);x.lineTo(-18,-8);x.lineTo(18,-8);x.lineTo(28,52);x.closePath();x.fill();x.shadowBlur=0;x.fillStyle='#ffd7bb';x.beginPath();x.arc(0,-28,16,0,7);x.fill();x.fillStyle='#17152e';x.beginPath();x.arc(0,-34,17,Math.PI,0);x.fill();x.strokeStyle='#78f6ff';x.lineWidth=5;x.beginPath();x.moveTo(22,4);x.lineTo(43,-35);x.stroke();x.fillStyle='#fff27a';x.shadowBlur=18;x.shadowColor='#fff27a';x.beginPath();x.arc(44,-37,6,0,7);x.fill();x.restore()}function drawCrystal(xx,yy,r){x.save();x.translate(xx,yy);x.rotate(t*.025);x.shadowBlur=25;x.shadowColor='#6ff';x.fillStyle='#69efff';x.beginPath();x.moveTo(0,-r);x.lineTo(r*.65,-r*.15);x.lineTo(r*.38,r);x.lineTo(-r*.38,r);x.lineTo(-r*.65,-r*.15);x.closePath();x.fill();x.restore()}function drawGuardian(xx,yy,r,a){x.save();x.translate(xx,yy+Math.sin(t*.06+a.phase)*5);x.shadowBlur=28;x.shadowColor='#df4cff';x.fillStyle='#4b2378';x.beginPath();x.ellipse(0,0,r*1.15,r*.7,0,0,7);x.fill();x.fillStyle='#8b4bd6';x.beginPath();x.moveTo(-r*.45,-r*.15);x.lineTo(-r*1.3,-r);x.lineTo(-r*.7,r*.1);x.closePath();x.fill();x.beginPath();x.moveTo(r*.45,-r*.15);x.lineTo(r*1.3,-r);x.lineTo(r*.7,r*.1);x.closePath();x.fill();x.fillStyle='#ffd95a';x.beginPath();x.arc(-r*.32,-r*.08,r*.12,0,7);x.arc(r*.32,-r*.08,r*.12,0,7);x.fill();x.restore()}function draw(){x.clearRect(0,0,W,H);let bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#20145e');bg.addColorStop(.5,'#080b32');bg.addColorStop(1,'#010208');x.fillStyle=bg;x.fillRect(0,0,W,H);for(let i=0;i<100;i++){let sx=(i*97-t*.18)%W;if(sx<0)sx+=W,0;let sy=(i*43)%Math.max(1,H*.42);x.fillStyle='rgba(255,255,255,.55)';x.fillRect(sx,sy,2,2)}x.fillStyle='rgba(212,175,55,.2)';x.beginPath();x.arc(W*.78,H*.2,50,0,7);x.fill();x.fillStyle='#273078';x.fillRect(W*.4,H*.34,W*.2,H*.18);x.fillStyle='#d4af37';x.beginPath();x.moveTo(W*.5,H*.18);x.lineTo(W*.43,H*.34);x.lineTo(W*.57,H*.34);x.closePath();x.fill();let vy=H*.42;x.fillStyle='#08091e';x.beginPath();x.moveTo(W*.12,H);x.lineTo(W*.88,H);x.lineTo(W*.56,vy);x.lineTo(W*.44,vy);x.closePath();x.fill();x.strokeStyle='rgba(212,175,55,.4)';x.lineWidth=3;x.beginPath();x.moveTo(W*.12,H);x.lineTo(W*.44,vy);x.moveTo(W*.88,H);x.lineTo(W*.56,vy);x.stroke();crystals.forEach(a=>{a.z-=.012;let s=project(a.z),xx=W/2+a.x*W*.55*s,yy=vy+(1-s)*H*.48;if(a.z<.52){if(Math.abs(a.x-px)<.18){got++;score+=25;burst(xx,yy,15);tone(900);a.z=6; a.x=(Math.random()*2-1)*.82}else{a.z=6}}drawCrystal(xx,yy,Math.max(9,35*s))});guardians.forEach(a=>{a.z-=.01;let s=project(a.z),xx=W/2+a.x*W*.55*s,yy=vy+(1-s)*H*.48;if(a.z<.52){if(Math.abs(a.x-px)<.2){lives--;score=Math.max(0,score-10);tone(130);burst(W/2+px*W*.32,H*.76,20)}a.z=6;a.x=(Math.random()*2-1)*.82}drawGuardian(xx,yy,Math.max(12,42*s),a)});shots.forEach(s=>{s.z+=.08;let q=project(s.z),xx=W/2+s.x*W*.55*q,yy=H*.76-(1-q)*H*.35;x.fillStyle='#9ff';x.shadowBlur=25;x.shadowColor='#6ff';x.beginPath();x.arc(xx,yy,5+10*q,0,7);x.fill();x.shadowBlur=0});particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.a-=.04;x.globalAlpha=Math.max(0,p.a);x.fillStyle='#9ff';x.fillRect(p.x,p.y,4,4)});x.globalAlpha=1;drawHero(W/2+px*W*.32,H*.76);hud()}function hitShots(){shots.forEach(s=>guardians.forEach(a=>{if(Math.abs(s.z-a.z)<.22&&Math.abs(s.x-a.x)<.22){a.z=6;a.x=(Math.random()*2-1)*.82;score+=40;burst(W/2+a.x*W*.25,H*.5,18);tone(1100)}}));shots=shots.filter(s=>s.z<6)}function loop(now){if(!run)return;t+=1;hitShots();draw();if(got>=10){run=false;o.style.display='grid';o.querySelector('.panel').innerHTML='<h1>🏆 Realm Complete!</h1><p>You collected all 10 crystals.<br><b>Score: '+score+'</b></p><button class="start" id="again">↻ PLAY AGAIN</button>';document.getElementById('again').onclick=start;return}if(lives<=0){run=false;o.style.display='grid';o.querySelector('.panel').innerHTML='<h1>🌌 Quest Over</h1><p>You reached <b>'+got+'/10</b> crystals.<br><b>Score: '+score+'</b></p><button class="start" id="again">↻ TRY AGAIN</button>';document.getElementById('again').onclick=start;return}requestAnimationFrame(loop)}document.getElementById('start').onclick=start;document.getElementById('cast').onclick=cast;document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>move(b.dataset.m==='left'?-0.12:0.12));addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-.12);if(e.key==='ArrowRight')move(.12);if(e.code==='Space')cast()});let sx=0;c.addEventListener('pointerdown',e=>sx=e.clientX);c.addEventListener('pointerup',e=>{let dx=e.clientX-sx;if(Math.abs(dx)>25)move(dx<0?-0.15:0.15);else cast()});resize();addEventListener('resize',resize);draw()})();</script></body></html>
