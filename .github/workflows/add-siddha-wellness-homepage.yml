name: Add Siddha Wellness to Homepage

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-siddha-section:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Insert Siddha Wellness section without replacing existing content
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker = '<!-- AYMP-SIDDHA-WELLNESS-SECTION -->'
          if marker in text:
              print('Siddha section already exists; no changes needed.')
              raise SystemExit(0)

          section = r'''\n<!-- AYMP-SIDDHA-WELLNESS-SECTION -->\n<section id="siddha-wellness" style="padding:80px 20px;">\n  <div class="container">\n    <h2 class="section-title">🌿 Siddha Wellness Solutions</h2>\n    <p style="text-align:center;font-size:20px;"><strong>Traditional Siddha Wisdom for Men &amp; Women</strong></p>\n    <p style="text-align:center;max-width:850px;margin:15px auto 35px;color:#d6d6d6;">\n      Explore AYMP's traditional Siddha-inspired wellness approach for vitality, reproductive wellness, physical strength and holistic well-being.\n    </p>\n    <div class="cards">\n      <div class="card">\n        <h3>👨 Men's Wellness</h3>\n        <p>Traditional approaches for male vitality, energy, reproductive wellness, strength and Kayakalpa-inspired wellness.</p>\n      </div>\n      <div class="card">\n        <h3>👩 Women's Wellness</h3>\n        <p>Traditional approaches supporting women's vitality, strength, reproductive and menstrual wellness.</p>\n      </div>\n      <div class="card">\n        <h3>🌱 General Siddha Wellness</h3>\n        <p>Traditional herbal wellness, vitality and Kayakalpa-inspired guidance for overall well-being.</p>\n      </div>\n    </div>\n    <div style="text-align:center;margin-top:30px;">\n      <a class="btn" href="siddha-wellness.html">Explore Siddha Wellness</a>\n    </div>\n  </div>\n</section>\n'''

          close = '</body>'
          pos = text.lower().rfind(close)
          if pos == -1:
              raise SystemExit('Could not find </body>; existing homepage was not modified.')

          text = text[:pos] + section + text[pos:]
          path.write_text(text, encoding='utf-8')
          print('Siddha Wellness section inserted before </body>.')
          PY

      - name: Commit homepage change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage change to commit."
          else
            git commit -m "Add Siddha Wellness section to homepage"
            git push
          fi
