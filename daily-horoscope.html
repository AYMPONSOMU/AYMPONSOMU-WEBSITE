<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Daily Horoscope</title>
  <style>
    /* Google Translate Box */
#google_translate_element{
    text-align:center;
    margin:20px 0;
}

/* முழு Widget */
.goog-te-gadget{
    font-size:24px !important;
    color:white !important;
    font-weight:bold;
}

/* Dropdown */
.goog-te-gadget select{
    font-size:22px !important;
    font-weight:bold;
    padding:12px 20px;
    min-width:280px;
    height:55px;
    border:3px solid gold;
    border-radius:12px;
    background:#13264a;
    color:white;
    cursor:pointer;
    box-shadow:0 0 12px gold;
}

/* Google Logo மறை */
.goog-logo-link{
    display:none !important;
}

.goog-te-gadget span{
    display:none !important;
}

.goog-te-gadget{
    color:transparent !important;
    }
body{
    background:#09142a;
    color:white;
    font-family:Arial,sans-serif;
    font-size:20px;
    line-height:1.8;
    padding:20px;
}

h1{
    color:gold;
    font-size:42px;
    text-align:center;
}

h2{
    color:gold;
    font-size:32px;
}

p{
    font-size:22px;
}

.card{
    background:#13264a;
    border:2px solid gold;
    border-radius:15px;
    padding:25px;
    margin:25px 0;
    box-shadow:0 0 15px rgba(255,215,0,0.3);
}

.card img{
    width:250px;
    border-radius:12px;
    display:block;
    margin:15px auto;
}

#google_translate_element{
    text-align:right;
    margin-bottom:20px;
}
</style>
</head>

<body style="background:#09142a;color:white;font-family:Arial;padding:20px;">
<div id="google_translate_element" style="text-align:right;padding:10px;"></div>
<h1 style="color:gold;text-align:center;">
FREE DAILY HOROSCOPE
</h1>

<div id="horoscope"></div>

<script src="js/horoscope.js"></script>
<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement(
    {
      pageLanguage: 'en',
      includedLanguages: 'en,ta,hi,te,ml,kn,bn,gu,mr,pa,ur,ar,fr,de,es,it,pt,ru,ja,ko,zh-CN',
      layout: google.translate.TranslateElement.InlineLayout.SIMPLE
    },
    'google_translate_element'
  );
}
</script>

<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
