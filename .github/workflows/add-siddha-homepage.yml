name: Add Siddha Wellness Section to Homepage

on:
  push:
    paths:
      - 'siddha-male-vitality.html'
      - '.github/workflows/add-siddha-homepage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-siddha-section:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Siddha section without replacing existing content
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<!-- AYMP_SIDDHA_MALE_VITALITY_V1 -->'
          if marker in text:
              print('Siddha homepage section already present.')
              raise SystemExit(0)

          section = r'''

<!-- AYMP_SIDDHA_MALE_VITALITY_V1 -->
<section>
  <div class="container">
    <div class="free-box" style="background:linear-gradient(135deg,#16264a,#3b214f);">
      <h2>Siddha Solutions for Male Vitality, Reproductive Wellness & Strength</h2>
      <p style="max-width:850px;margin:0 auto;color:#d8d8e5;">
        Discover AYMPONSOMU's traditional Siddha-inspired wellness approach for men's vitality,
        reproductive wellness, physical stamina and long-term well-being.
      </p>
      <div class="cards" style="margin-top:30px;text-align:left;">
        <div class="card">
          <h3>Male Vitality & Vigor</h3>
          <p>Traditional herbal wellness approaches intended to support daily energy, physical stamina and overall vitality.</p>
        </div>
        <div class="card">
          <h3>Reproductive Wellness</h3>
          <p>Traditional Siddha approaches focused on supporting reproductive wellness and healthy lifestyle practices.</p>
        </div>
        <div class="card">
          <h3>Body Strength & Kayakalpa Wellness</h3>
          <p>A traditional Kayakalpa-inspired approach focused on nourishment, vitality and long-term physical well-being.</p>
        </div>
      </div>
      <a class="btn" href="siddha-male-vitality.html">Explore Siddha Wellness</a>
      <p style="font-size:13px;color:#bfc2d1;margin-top:20px;">
        Traditional wellness information only. It does not diagnose disease or guarantee fertility, sexual or other health outcomes.
      </p>
    </div>
  </div>
</section>
'''

          closing = '</body>'
          if closing not in text:
              raise SystemExit('Could not find </body> in index.html')
          text = text.replace(closing, section + '\n' + closing, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No homepage change required.'
          else
            git commit -m 'Add Siddha wellness section to homepage'
            git push
          fi
