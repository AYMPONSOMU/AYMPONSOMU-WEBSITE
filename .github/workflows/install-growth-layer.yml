name: Install AYMP Growth Layer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install-growth-layer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add growth script tag to homepage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<!-- AYMP-GROWTH-LAYER -->'
          tag = '  ' + marker + '\n  <script src="assets/js/aymp-growth.js?v=1"></script>\n'
          if marker not in text:
              text = text.replace('</body>', tag + '</body>', 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage integration
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Growth layer already installed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Install additive AYMP growth layer"
          git push
