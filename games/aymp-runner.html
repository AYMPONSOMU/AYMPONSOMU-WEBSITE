<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AYMP Cosmic Runner</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#050816;color:#fff;font-family:system-ui}body{display:grid;place-items:center}.game{width:min(96vw,900px);height:min(88vh,560px);position:relative;border:2px solid #c9a227;border-radius:22px;overflow:hidden;background:radial-gradient(circle at 50% 20%,#18265c,#050816 65%)}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:14px 18px auto;display:flex;justify-content:space-between;font-weight:900;text-shadow:0 2px 8px #000}.hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#ddd;font-size:13px}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.42);text-align:center}.panel{padding:28px;border-radius:20px;background:rgba(4,8,25,.88);border:1px solid rgba(255,215,0,.4)}button{padding:12px 22px;border:0;border-radius:24px;background:#d4af37;font-weight:900;font-size:16px}h1{color:#ffd700}</style></head><body><div class="game"><canvas id="c" width="900" height="560"></canvas><div class="hud"><span>🌌 AYMP COSMIC RUNNER</span><span id="score">Score: 0</span></div><div class="hint">Tap / Space = Jump • Collect ⭐ • Avoid 🔥</div><div class="overlay" id="o"><div class="panel"><h1>AYMP Cosmic Runner</h1><p>Run through the cosmic world, collect stars and avoid fire.</p><button id="start">▶ START GAME</button></div></div></div><script>(function(){const c=document.getElementById('c'),x=c.getContext('2d'),o=document.getElementById('o'),s=document.getElementById('score');let p,obs,stars,sc,run,frame,last;function reset(){p={x:120,y:440,w:38,h:48,vy:0,on:true};obs=[];stars=[];sc=0;frame=0;run=true;last=performance.now();o.style.display='none';requestAnimationFrame(loop)}function jump(){if(run&&p.on){p.vy=-15;p.on=false}}function add(){if(frame%85===0)obs.push({x:930,y:445,w:28,h:43});if(frame%63===0)stars.push({x:930,y:350+Math.random()*90,r:9})}function draw(){x.clearRect(0,0,900,560);let g=x.createLinearGradient(0,0,0,560);g.addColorStop(0,'#111b4d');g.addColorStop(1,'#050816');x.fillStyle=g;x.fillRect(0,0,900,560);for(let i=0;i<45;i++){x.fillStyle='rgba(255,255,255,.7)';x.fillRect((i*83+frame*.25)%900,(i*47)%350,2,2)}x.fillStyle='#17152a';x.fillRect(0,488,900,72);x.strokeStyle='#c9a227';x.strokeRect(0,487,900,2);x.font='38px sans-serif';x.fillText('🧙',p.x,p.y+38);x.font='32px sans-serif';obs.forEach(a=>x.fillText('🔥',a.x,a.y+35));x.font='26px sans-serif';stars.forEach(a=>x.fillText('⭐',a.x,a.y));s.textContent='Score: '+sc}function loop(t){if(!run)return;let dt=Math.min(2,(t-last)/16);last=t;frame++;p.vy+=.8*dt;p.y+=p.vy*dt;if(p.y>=440){p.y=440;p.vy=0;p.on=true}add();obs.forEach(a=>a.x-=6*dt);stars.forEach(a=>a.x-=5*dt);obs=obs.filter(a=>a.x>-60);stars=stars.filter(a=>a.x>-40);for(const a of obs){if(p.x+32>a.x&&p.x<a.x+a.w&&p.y+40>a.y&&p.y<a.y+a.h){run=false;over()}}stars=stars.filter(a=>{if(Math.hypot(a.x-(p.x+18),a.y-(p.y+20))<28){sc+=10;return false}return true});draw();requestAnimationFrame(loop)}function over(){o.style.display='grid';o.querySelector('.panel').innerHTML='<h1>Game Over</h1><p>Your Score: <b>'+sc+'</b></p><button id="again">↻ PLAY AGAIN</button>';document.getElementById('again').onclick=reset}document.getElementById('start').onclick=reset;addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();jump()}});c.addEventListener('pointerdown',jump);draw()})();</script></body></html>
