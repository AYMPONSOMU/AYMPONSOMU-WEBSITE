name: AYMP Siddha Wellness Homepage Integration

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-siddha-section:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add Siddha Wellness section to homepage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<!-- AYMP_SIDDHA_WELLNESS_SECTION_V1 -->'

          if marker not in text:
              section = r'''

<!-- AYMP_SIDDHA_WELLNESS_SECTION_V1 -->
<section id="siddha-wellness" style="padding:90px 20px;">
  <div class="container">
    <div class="free-box" style="text-align:center;">
      <div style="color:#ffdf6b;letter-spacing:2px;text-transform:uppercase;font-size:13px;font-weight:600;margin-bottom:12px;">AYMPONSOMU • Traditional Siddha Wellness & Research</div>
      <h2 style="color:#ffd700;font-family:'Cinzel',serif;font-size:clamp(30px,5vw,44px);margin-bottom:20px;">Siddha Wellness Solutions for Men & Women</h2>
      <p style="max-width:850px;margin:0 auto 28px;color:#ddd;font-size:17px;">Traditional Siddha wisdom, herbal knowledge and holistic wellness guidance for vitality, strength and reproductive wellness.</p>
      <div class="cards" style="text-align:left;margin-top:30px;">
        <div class="card"><h3>Men's Wellness</h3><p>Traditional wellness approaches for male vitality, physical strength, reproductive wellness and Kayakalpa-inspired well-being.</p></div>
        <div class="card"><h3>Women's Wellness</h3><p>Traditional wellness approaches for women's vitality, strength, reproductive and menstrual well-being and Kayakalpa-inspired wellness.</p></div>
        <div class="card"><h3>General Siddha Wellness</h3><p>Structured traditional herbal wellness information, formulation records and Siddha research documentation for responsible learning and consultation.</p></div>
      </div>
      <a class="btn" href="siddha-wellness.html" style="display:inline-block;margin-top:32px;">Explore Siddha Wellness</a>
    </div>
  </div>
</section>
'''
              closing = '</body>'
              if closing not in text:
                  raise SystemExit('index.html does not contain closing body tag')
              text = text.replace(closing, section + '\n' + closing, 1)
              path.write_text(text, encoding='utf-8')
              print('Siddha Wellness section added to index.html')
          else:
              print('Siddha Wellness section already present')
          PY

      - name: Commit homepage integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No homepage changes needed.'
          else
            git commit -m 'Add Siddha Wellness section to homepage'
            git push
          fi
