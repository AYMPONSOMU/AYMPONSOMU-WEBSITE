name: Install AYMP Home Navigation

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add navigation script to homepage once
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          src='assets/js/aymp-home-navigation.js'
          marker='<!-- AYMP-HOME-NAVIGATION -->'
          if marker in text:
              print('Navigation already installed.')
              raise SystemExit(0)
          tag=f'\n  {marker}\n  <script src="{src}" defer></script>\n'
          pos=text.lower().rfind('</body>')
          if pos < 0:
              raise SystemExit('No </body> tag; homepage unchanged.')
          text=text[:pos]+tag+text[pos:]
          p.write_text(text,encoding='utf-8')
          PY

      - name: Commit navigation integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No homepage change required.'
          else
            git commit -m 'Add simple AYMP homepage navigation'
            git push origin HEAD:main
          fi
