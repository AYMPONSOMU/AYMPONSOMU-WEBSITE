name: Add Siddha Wellness to Homepage

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-siddha-section:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add or update only the Siddha Wellness section
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<!-- AYMP-SIDDHA-WELLNESS-SECTION -->'

          section = r'''<!-- AYMP-SIDDHA-WELLNESS-SECTION -->
          <section id="siddha-wellness" style="padding:80px 20px;">
            <div class="container">
              <h2 class="section-title">🌿 Siddha Wellness Solutions</h2>
              <p style="text-align:center;font-size:20px;"><strong>Traditional Siddha Wisdom for Men &amp; Women</strong></p>

              <div id="siddha-wellness-details" style="display:none;margin-top:30px;">
                <p style="text-align:center;max-width:850px;margin:0 auto 35px;color:#d6d6d6;">
                  Discover a holistic approach to wellness inspired by the traditional Siddha tradition. AYMP brings together traditional herbal knowledge, vitality practices and Kayakalpa-inspired wellness guidance for men and women.
                </p>
                <div class="cards">
                  <div class="card">
                    <h3>👨 Men's Wellness</h3>
                    <p>Traditional herbal wellness approaches supporting male vitality, physical energy, stamina and reproductive wellness.</p>
                  </div>
                  <div class="card">
                    <h3>👩 Women's Wellness</h3>
                    <p>Traditional wellness approaches supporting women's vitality, strength and reproductive and menstrual wellness.</p>
                  </div>
                  <div class="card">
                    <h3>🌱 General Siddha Wellness</h3>
                    <p>Traditional herbal wellness and Kayakalpa-inspired practices supporting overall vitality, physical strength and holistic well-being.</p>
                  </div>
                </div>
                <div style="margin:30px auto 0;max-width:850px;text-align:center;color:#d6d6d6;">
                  <p><strong>🔬 AYMP Siddha Research</strong></p>
                  <p style="margin-top:10px;">Our Siddha formulations and traditional wellness practices can be documented through a structured research framework covering traditional use, ingredients, preparation methods, safety information, references and verification status.</p>
                </div>
              </div>

              <div style="text-align:center;margin-top:30px;">
                <button type="button" class="btn" id="siddha-wellness-toggle" aria-expanded="false" aria-controls="siddha-wellness-details">Explore Siddha Wellness</button>
              </div>
            </div>
          </section>
          <script>
          (function(){
            var button=document.getElementById('siddha-wellness-toggle');
            var details=document.getElementById('siddha-wellness-details');
            if(!button||!details)return;
            button.addEventListener('click',function(){
              var open=details.style.display!=='none';
              details.style.display=open?'none':'block';
              button.setAttribute('aria-expanded',String(!open));
              button.textContent=open?'Explore Siddha Wellness':'Hide Siddha Wellness';
            });
          })();
          </script>
          '''

          if marker in text:
              start = text.index(marker)
              end_tag = '</section>'
              end = text.find(end_tag, start)
              if end == -1:
                  raise SystemExit('Existing Siddha section marker found but closing section was not found; homepage was not modified.')
              end += len(end_tag)
              # Include the existing Siddha script if present, up to </script>.
              script_end = text.find('</script>', end)
              if script_end != -1:
                  between = text[end:script_end + len('</script>')]
                  if 'siddha-wellness-toggle' in between:
                      end = script_end + len('</script>')
              text = text[:start] + section + text[end:]
              print('Existing Siddha section updated only.')
          else:
              close = '</body>'
              pos = text.lower().rfind(close)
              if pos == -1:
                  raise SystemExit('Could not find </body>; existing homepage was not modified.')
              text = text[:pos] + section + text[pos:]
              print('New Siddha section inserted only.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage change to commit."
          else
            git commit -m "Make Siddha Wellness details expandable"
            git push
          fi
