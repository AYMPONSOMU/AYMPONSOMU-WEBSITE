<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Horoscope</title>

<style>

/* ==========================
   BODY
========================== */

body{
    margin:0;
    padding:20px;
    background:#09142a;
    color:white;
    font-family:Arial,sans-serif;
    overflow-x:hidden;
    position:relative;
    line-height:1.8;
}

/* ==========================
   GOLDEN STARS BACKGROUND
========================== */

body::before{

content:"";

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

pointer-events:none;

background-image:

radial-gradient(circle,#FFD700 1px,transparent 2px),

radial-gradient(circle,#FFF8DC 1.5px,transparent 2px),

radial-gradient(circle,#FFD700 2px,transparent 3px);

background-size:

180px 180px,

260px 260px,

350px 350px;

background-position:

0 0,

80px 120px,

150px 60px;

animation:twinkle 6s infinite alternate;

opacity:.75;

}

@keyframes twinkle{

0%{
opacity:.35;
filter:brightness(90%);
}

50%{
opacity:1;
filter:brightness(180%);
}

100%{
opacity:.45;
filter:brightness(120%);
}

}

/* ==========================
   GOOGLE TRANSLATE
========================== */

#google_translate_element{

text-align:right;

margin-bottom:20px;

}

.goog-te-gadget{

font-size:22px !important;

font-weight:bold;

color:white !important;

}

.goog-te-gadget select{

font-size:22px !important;

padding:12px 20px;

min-width:280px;

height:55px;

border-radius:12px;

border:3px solid gold;

background:#13264a;

color:white;

font-weight:bold;

cursor:pointer;

box-shadow:0 0 15px gold;

}

/* ==========================
   HEADING
========================== */

h1{

color:gold;

font-size:48px;

text-align:center;

margin-top:10px;

}

h2{

color:gold;

font-size:36px;

margin-bottom:15px;

}

/* ==========================
   PARAGRAPH
========================== */

p{

font-size:28px;

color:white;

margin:10px 0;

}

b,strong{

color:#FFD700;

font-size:30px;

}

/* ==========================
   CARD
========================== */

.card{

background:#13264a;

border:2px solid gold;

border-radius:15px;

padding:25px;

margin:25px 0;

box-shadow:0 0 18px rgba(255,215,0,.35);

}

.card img{

display:block;

margin:auto;

width:240px;

border-radius:12px;

border:2px solid gold;

box-shadow:0 0 15px gold;

}

/* ==========================
   MOBILE
========================== */

@media(max-width:768px){

h1{
font-size:40px;
}

h2{
font-size:32px;
}

p{
font-size:24px;
}

b,strong{
font-size:26px;
}

.goog-te-gadget select{

width:100%;

font-size:20px !important;

}

.card img{

width:200px;

}

}

</style>

</head>

<body>

<div id="google_translate_element"></div>

<h1>FREE DAILY HOROSCOPE</h1>

<div id="horoscope"></div>

<script src="js/horoscope.js"></script>

<script>

function googleTranslateElementInit(){

new google.translate.TranslateElement(

{

pageLanguage:'en',

includedLanguages:'en,ta,hi,te,ml,kn,bn,gu,mr,pa,ur,ar,fr,de,es,it,pt,ru,ja,ko,zh-CN',

layout:google.translate.TranslateElement.InlineLayout.SIMPLE

},

'google_translate_element'

);

}

</script>

<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>

</html>
