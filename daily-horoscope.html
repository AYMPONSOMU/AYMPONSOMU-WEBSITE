<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AYMP Cosmic Kingdom | Daily Horoscope</title>

<style>

/* ==========================
   BODY
========================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#09142a;
    color:white;
    font-family:Arial,sans-serif;
    overflow-x:hidden;
    position:relative;
    padding:15px;
    line-height:1.7;

}

/* ==========================
   COSMIC STARS
========================== */

body::before{

content:"";

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

pointer-events:none;

background-image:

radial-gradient(circle,#FFD700 1px,transparent 10px),
radial-gradient(circle,#FFF8DC 1px,transparent 13px),
radial-gradient(circle,#FFD700 2px,transparent 18px);

background-size:
180px 180px,
260px 260px,
340px 340px;

animation:twinkle 6s infinite alternate;

opacity:.8;

z-index:-1;

}

@keyframes twinkle{

0%{
opacity:.35;
}

50%{
opacity:1;
}

100%{
opacity:.55;
}

}

/* ==========================
GOOGLE TRANSLATE
========================== */

#google_translate_element{

text-align:center;

margin:15px auto 25px auto;

}

.goog-te-gadget{

font-size:20px !important;

font-weight:bold;

}

.goog-te-gadget select{

background:#13264a;

color:white;

border:2px solid gold;

border-radius:10px;

padding:10px;

font-size:20px !important;

font-weight:bold;

min-width:260px;

}

/* ==========================
TITLE
========================== */

h1{

text-align:center;

color:gold;

font-size:40px;

margin-bottom:20px;

text-shadow:0 0 15px gold;

}

/* ==========================
HOROSCOPE CARD
========================== */

.card{

width:95%;

max-width:680px;

margin:18px auto;

background:#13264a;

border:2px solid gold;

border-radius:15px;

padding:18px;

box-shadow:0 0 12px rgba(255,215,0,.30);

transition:.3s;

}

.card:hover{

transform:scale(1.02);

box-shadow:0 0 20px gold;

}

.card h2{

text-align:center;

font-size:20px;

color:gold;

margin-bottom:15px;

}

.card p{

font-size:20px;

margin:8px 0;

line-height:1.6;

}

.card b{

color:#FFD700;

}

/* ==========================
YANTRA IMAGE
========================== */

.card img{

display:block;

width:70px;

margin:15px auto;

border-radius:12px;

border:2px solid gold;

box-shadow:0 0 15px gold;

}

/* ==========================
MOBILE
========================== */

@media(max-width:768px){

h1{

font-size:34px;

}

.card{

max-width:45%;

padding:15px;

}

.card h2{

font-size:16px;

}

.card p{

font-size:18px;

}

.card img{

width:90px;

}

.goog-te-gadget select{

width:100%;

font-size:18px !important;

}

}

</style>

</head>
<body>

<div id="google_translate_element"></div>

<h1>🔮 FREE DAILY HOROSCOPE 🔮</h1>

<div id="horoscope"></div>

<!-- Horoscope Data -->
<script src="js/horoscope.js"></script>

<!-- Google Translate -->
<script type="text/javascript">

function googleTranslateElementInit(){

new google.translate.TranslateElement(

{

pageLanguage:'en',

includedLanguages:
'en,ta,hi,te,ml,kn,bn,gu,mr,pa,ur,ar,fr,de,es,it,pt,ru,ja,ko,zh-CN',

layout:google.translate.TranslateElement.InlineLayout.SIMPLE

},

'google_translate_element'

);

}

</script>

<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>

   </html>
