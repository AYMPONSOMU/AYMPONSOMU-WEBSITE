<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="description" content="AYMP Cosmic Snake - a fun cosmic snake game with stars, crystals and power-ups."><title>AYMP Cosmic Snake</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#030612;color:#fff;font-family:system-ui}body{display:grid;place-items:center}.game{width:min(96vw,900px);height:min(90vh,700px);position:relative;border:2px solid #c9a227;border-radius:22px;overflow:hidden;background:#050b22;box-shadow:0 0 40px #000}.hud{position:absolute;z-index:3;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-weight:900;text-shadow:0 2px 7px #000}.pill{padding:8px 11px;border-radius:20px;background:rgba(3,7,25,.75);border:1px solid rgba(255,215,0,.35)}canvas{width:100%;height:100%;display:block;touch-action:none}.hint{position:absolute;z-index:3;bottom:9px;left:0;right:0;text-align:center;font-size:13px;color:#ddd}.overlay{position:absolute;z-index:5;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.52);text-align:center}.panel{width:min(82%,430px);padding:28px;border-radius:22px;background:rgba(4,8,25,.95);border:1px solid rgba(255,215,0,.45);box-shadow:0 15px 50px #000}h1{margin:0 0 10px;color:#ffd700;font-family:Georgia,serif;font-size:36px}p{color:#ddd;line-height:1.6}button{padding:13px 24px;border:0;border-radius:26px;background:#d4af37;color:#111;font-weight:900;font-size:17px}.back{display:block;margin-top:14px;color:#ffd700;text-decoration:none}</style></head><body><div class="game"><canvas id="c" width="900" height="700"></canvas><div class="hud"><span class="pill">🐍 AYMP COSMIC SNAKE</span><span class="pill" id="score">⭐ 0</span><span class="pill" id="best">🏆 0</span><span class="pill" id="level">LEVEL 1</span></div><div class="hint">👆 Swipe / Arrow Keys • ⭐ Eat Stars • 💎 Crystals • ⚡ Power-up</div><div class="overlay" id="o"><div class="panel"><h1>🐍 Cosmic Snake</h1><p>Guide your cosmic snake, collect stars and crystals, grow longer and beat your best score!</p><button id="start">▶ START GAME</button><a class="back" href="../game-zone.html">← Back to Game Zone</a></div></div></div><script>(()=>{const c=document.getElementById('c'),ctx=c.getContext('2d'),o=document.getElementById('o'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),levelEl=document.getElementById('level'),N=30,S=23,W=900,H=700;let snake,dir,next,food,crystal,power,score,best,level,timer,running,shield;best=Number(localStorage.getItem('aymp-snake-best')||0);bestEl.textContent='🏆 '+best;function cell(){return Math.floor(Math.random()*N)}function place(){let q;do{q={x:cell(),y:cell()}}while(snake.some(s=>s.x===q.x&&s.y===q.y)||(food&&food.x===q.x&&food.y===q.y));return q}function reset(){snake=[{x:15,y:16},{x:14,y:16},{x:13,y:16}];dir={x:1,y:0};next={x:1,y:0};food=place();crystal=null;power=null;score=0;level=1;shield=0;running=true;o.style.display='none';update();timer=setInterval(step,Math.max(70,145-level*8));draw()}function update(){scoreEl.textContent='⭐ '+score;bestEl.textContent='🏆 '+best;levelEl.textContent='LEVEL '+level}function step(){if(!running)return;dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=N||h.y<0||h.y>=N||snake.some((s,i)=>i>0&&s.x===h.x&&s.y===h.y)){if(shield){shield=0;h={x:snake[0].x,y:snake[0].y}}else return gameOver()}snake.unshift(h);let ate=false;if(h.x===food.x&&h.y===food.y){score+=10;ate=true;food=place();if(Math.random()<.35)crystal=place()}if(crystal&&h.x===crystal.x&&h.y===crystal.y){score+=25;crystal=null}if(power&&h.x===power.x&&h.y===power.y){shield=1;power=null;score+=20}if(!ate)snake.pop();if(score>best){best=score;localStorage.setItem('aymp-snake-best',best)}level=Math.min(8,1+Math.floor(score/100));if(Math.random()<.02&&(!power))power=place();clearInterval(timer);timer=setInterval(step,Math.max(60,145-level*8));update();draw()}function gameOver(){running=false;clearInterval(timer);o.style.display='grid';o.querySelector('.panel').innerHTML='<h1>🌌 Game Over</h1><p>Cosmic Score: <b>'+score+'</b><br>Best Score: <b>'+best+'</b></p><button id="again">↻ PLAY AGAIN</button><a class="back" href="../game-zone.html">← Back to Game Zone</a>';document.getElementById('again').onclick=reset}function draw(){let g=ctx.createRadialGradient(W/2,H/2,30,W/2,H/2,600);g.addColorStop(0,'#101b55');g.addColorStop(1,'#030612');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<90;i++){ctx.globalAlpha=.25+(i%4)*.12;ctx.fillStyle='#fff';ctx.fillRect((i*97)%W,(i*53)%H,2,2)}ctx.globalAlpha=1;ctx.strokeStyle='rgba(255,215,0,.08)';for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*S,10);ctx.lineTo(i*S,10+N*S);ctx.stroke();ctx.beginPath();ctx.moveTo(10,i*S);ctx.lineTo(10+N*S,i*S);ctx.stroke()}function item(q,t){ctx.font='22px sans-serif';ctx.fillText(t,10+q.x*S+1,10+q.y*S+20)}item(food,'⭐');if(crystal)item(crystal,'💎');if(power)item(power,'⚡');snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#7de7ff':'#2670b8';ctx.shadowBlur=i===0?15:5;ctx.shadowColor='#48dfff';ctx.beginPath();ctx.roundRect(10+s.x*S+2,10+s.y*S+2,S-4,S-4,6);ctx.fill();ctx.shadowBlur=0;if(i===0){ctx.fillStyle='#07152f';ctx.beginPath();ctx.arc(10+s.x*S+8,10+s.y*S+8,2.5,0,Math.PI*2);ctx.arc(10+s.x*S+15,10+s.y*S+8,2.5,0,Math.PI*2);ctx.fill()}});if(shield){ctx.strokeStyle='#ffd700';ctx.lineWidth=3;ctx.beginPath();ctx.arc(10+snake[0].x*S+10,10+snake[0].y*S+10,15,0,Math.PI*2);ctx.stroke()}}function setDir(x,y){if(dir.x===-x&&dir.y===-y)return;next={x,y}}addEventListener('keydown',e=>{if(e.key==='ArrowUp')setDir(0,-1);else if(e.key==='ArrowDown')setDir(0,1);else if(e.key==='ArrowLeft')setDir(-1,0);else if(e.key==='ArrowRight')setDir(1,0)});let sx=0,sy=0;c.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});c.addEventListener('pointerup',e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1)});document.getElementById('start').onclick=reset;draw()})();</script></body></html>
