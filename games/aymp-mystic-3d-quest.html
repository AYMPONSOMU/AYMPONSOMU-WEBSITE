<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="description" content="AYMP Mystic 3D Quest - magical world action adventure."><title>AYMP Mystic 3D Quest</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#03030d;color:#fff;font-family:system-ui}body{display:grid;place-items:center}.game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#02030b}.scene{position:absolute;inset:0;perspective:700px;background:radial-gradient(circle at 50% 30%,#263b91 0,#090c2b 42%,#02030b 100%)}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;z-index:4;top:10px;left:10px;right:10px;display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:18px;background:rgba(3,5,24,.82);border:1px solid rgba(255,215,0,.4);font-weight:900;font-size:12px}.controls{position:absolute;z-index:5;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:10px}.controls button{width:58px;height:50px;border:1px solid rgba(255,215,0,.55);border-radius:18px;background:rgba(4,7,28,.88);color:#ffd700;font-size:22px;font-weight:900}.controls .shoot{width:100px;background:rgba(120,25,120,.8)}.overlay{position:absolute;z-index:10;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.62);padding:18px;text-align:center}.panel{width:min(88vw,450px);padding:25px;border-radius:24px;background:rgba(5,7,27,.97);border:1px solid rgba(255,215,0,.5);box-shadow:0 15px 60px #000}.panel h1{margin:0 0 10px;color:#ffd700;font:700 32px Georgia,serif}.panel p{color:#ddd;line-height:1.55}.start{padding:13px 23px;border:0;border-radius:26px;background:#d4af37;color:#111;font-weight:900;font-size:16px}.hint{font-size:12px;color:#aaa;margin-top:12px}</style></head><body><div class="game"><div class="scene"><canvas id="c" width="1000" height="700"></canvas></div><div class="hud"><span class="pill">🌌 MYSTIC 3D QUEST</span><span class="pill" id="score">💎 0</span><span class="pill" id="best">🏆 0</span><span class="pill" id="life">❤️ 3</span><span class="pill" id="level">REALM 1</span></div><div class="controls"><button data-k="left">◀</button><button data-k="up">▲</button><button data-k="down">▼</button><button data-k="right">▶</button><button class="shoot" id="shoot">✨ CAST</button></div><div class="overlay" id="o"><div class="panel"><h1>🌌 AYMP Mystic 3D Quest</h1><p>Enter a magical cosmic realm. Move, cast energy bolts, collect crystals and defeat mystical guardians.</p><button class="start" id="start">▶ ENTER THE MYSTIC WORLD</button><div class="hint">Mobile buttons • Swipe to aim/move • Tap CAST to shoot</div></div></div></div><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),o=document.getElementById('o');let score=0,best=+localStorage.getItem('aymp-mystic-best')||0,life=3,level=1,running=false,t=0,last=0,px=0,shot=0,targets=[],bolts=[],parts=[],keys={};document.getElementById('best').textContent='🏆 '+best;function start(){score=0;life=3;level=1;px=0;shot=0;targets=[];bolts=[];parts=[];running=true;o.style.display='none';for(let i=0;i<7;i++)spawn(i);last=performance.now();requestAnimationFrame(loop)}function spawn(i=0){targets.push({x:(Math.random()*2-1)*.8,z:3+i*1.2+Math.random()*2,type:Math.random()<.2?'boss':Math.random()<.35?'crystal':'orb',spin:Math.random()*6})}function burst(px,py,n=14){for(let i=0;i<n;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,a:1})}function cast(){if(!running)return;bolts.push({x:px,z:1.2});shot++;burst(500+px*180,520,5)}function move(k){if(!running)return;if(k==='left')px=Math.max(-.88,px-.12);if(k==='right')px=Math.min(.88,px+.12)}function hud(){document.getElementById('score').textContent='💎 '+score;document.getElementById('best').textContent='🏆 '+best;document.getElementById('life').textContent='❤️ '+life;document.getElementById('level').textContent='REALM '+level}function project(z){return 1/(z+.35)}function draw(){let g=x.createLinearGradient(0,0,0,700);g.addColorStop(0,'#18266b');g.addColorStop(.55,'#080d2d');g.addColorStop(1,'#02030b');x.fillStyle=g;x.fillRect(0,0,1000,700);for(let i=0;i<90;i++){let sx=(i*97-t*.25)%1000;if(sx<0)sx+=1000,0;let sy=(i*53)%360+20;x.globalAlpha=.35+(i%4)*.12;x.fillStyle='#fff';x.fillRect(sx,sy,2,2)}x.globalAlpha=1;for(let i=0;i<5;i++){let bx=(i*260-t*.15)%1250-125;x.fillStyle='rgba(100,80,220,.25)';x.beginPath();x.arc(bx,260+(i%2)*50,110+i*12,0,7);x.fill()}// magical road
x.fillStyle='#08091e';x.beginPath();x.moveTo(170,700);x.lineTo(830,700);x.lineTo(560,370);x.lineTo(440,370);x.closePath();x.fill();x.strokeStyle='rgba(212,175,55,.45)';x.lineWidth=3;x.beginPath();x.moveTo(170,700);x.lineTo(440,370);x.moveTo(830,700);x.lineTo(560,370);x.stroke();// palace
x.fillStyle='#252b72';x.fillRect(420,210,160,150);x.fillStyle='#d4af37';x.beginPath();x.moveTo(500,120);x.lineTo(450,210);x.lineTo(550,210);x.closePath();x.fill();x.fillStyle='#101642';x.fillRect(475,275,50,85);for(let i=0;i<3;i++){x.fillStyle='#9ef';x.fillRect(440+i*55,245,18,35)}targets.forEach(a=>{a.z-=.018*(level+.5);let s=project(a.z),sx=500+a.x*520*s,sy=350+(1-s)*250,r=Math.max(8,42*s);x.save();x.translate(sx,sy);x.rotate(a.spin+t*.03);x.shadowBlur=24;x.shadowColor=a.type==='crystal'?'#6ff':'#d4af37';x.fillStyle=a.type==='crystal'?'#72e6ff':a.type==='boss'?'#e54bff':'#ffd84a';if(a.type==='crystal'){x.beginPath();x.moveTo(0,-r);x.lineTo(r*.55,0);x.lineTo(0,r);x.lineTo(-r*.55,0);x.closePath();x.fill()}else{x.beginPath();x.arc(0,0,r,0,7);x.fill()}x.restore()});bolts.forEach(b=>{b.z+=.18;let s=project(b.z),sx=500+(b.x-px)*450*s,sy=530-(1-s)*180;x.fillStyle='#8ff';x.shadowBlur=25;x.shadowColor='#8ff';x.beginPath();x.arc(sx,sy,9+12*s,0,7);x.fill();x.shadowBlur=0});x.fillStyle='#45d8ff';x.shadowBlur=18;x.shadowColor='#45d8ff';x.beginPath();x.moveTo(500+px*150,540);x.lineTo(475+px*150,600);x.lineTo(525+px*150,600);x.closePath();x.fill();x.shadowBlur=0;parts.forEach(p=>{x.globalAlpha=p.a;x.fillStyle='#8ff';x.fillRect(p.x,p.y,5,5)});x.globalAlpha=1}function update(){targets.forEach(a=>{if(a.z<.7){a.z=4+Math.random()*3;a.x=(Math.random()*2-1)*.8;if(a.type==='boss'){life--;burst(500+px*150,540,25);if(life<=0)return end()}else{score+=a.type==='crystal'?25:10;burst(500+a.x*150,450,12);if(score>best){best=score;localStorage.setItem('aymp-mystic-best',best)}}} });bolts.forEach(b=>{for(const a of targets){if(Math.abs(a.z-b.z)<.25&&Math.abs(a.x-b.x)<.18){score+=a.type==='boss'?50:a.type==='crystal'?25:10;burst(500+a.x*250,350,18);a.z=5+Math.random()*2;a.x=(Math.random()*2-1)*.8;if(score>best){best=score;localStorage.setItem('aymp-mystic-best',best)}break}}});bolts=bolts.filter(b=>b.z<5);level=Math.min(10,1+Math.floor(score/100));hud()}function end(){running=false;o.style.display='grid';o.querySelector('.panel').innerHTML='<h1>🌌 Quest Ended</h1><p>Score: <b>'+score+'</b><br>Best: <b>'+best+'</b></p><button class="start" id="again">↻ PLAY AGAIN</button>';document.getElementById('again').onclick=start}function loop(now){if(!running)return;let dt=Math.min(2,(now-last)/16);last=now;t+=dt*3;update();draw();requestAnimationFrame(loop)}document.getElementById('start').onclick=start;document.getElementById('shoot').onclick=cast;document.querySelectorAll('.controls button[data-k]').forEach(b=>b.onclick=()=>move(b.dataset.k));addEventListener('keydown',e=>{if(e.code==='Space')cast();if(e.key==='ArrowLeft')move('left');if(e.key==='ArrowRight')move('right');if(e.key==='ArrowUp')move('up');if(e.key==='ArrowDown')move('down')});let sx=0;c.addEventListener('pointerdown',e=>sx=e.clientX);c.addEventListener('pointerup',e=>{let dx=e.clientX-sx;if(Math.abs(dx)>25)move(dx<0?'left':'right');else cast()});draw();})();</script></body></html>
