<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="description" content="AYMP Cosmic Runner - an animated cosmic adventure game."><title>AYMP Cosmic Runner</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#030612;color:#fff;font-family:system-ui}body{display:grid;place-items:center}.game{width:min(96vw,1000px);height:min(90vh,620px);position:relative;border:2px solid #c9a227;border-radius:22px;overflow:hidden;background:#07102d;box-shadow:0 0 40px #000}.game:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 65%,rgba(0,0,0,.3))}.hud{position:absolute;z-index:3;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;gap:6px;font-weight:900;text-shadow:0 2px 7px #000;flex-wrap:wrap}.pill{padding:8px 11px;border-radius:20px;background:rgba(3,7,25,.72);border:1px solid rgba(255,215,0,.35)}canvas{width:100%;height:100%;display:block}.hint{position:absolute;z-index:3;bottom:9px;left:0;right:0;text-align:center;font-size:13px;color:#ddd}.overlay{position:absolute;z-index:5;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);text-align:center}.panel{width:min(82%,430px);padding:28px;border-radius:22px;background:rgba(4,8,25,.94);border:1px solid rgba(255,215,0,.45);box-shadow:0 15px 50px #000}h1{margin:0 0 10px;color:#ffd700;font-family:Georgia,serif}p{color:#ddd;line-height:1.6}button{padding:13px 24px;border:0;border-radius:26px;background:#d4af37;color:#111;font-weight:900;font-size:17px}</style></head><body><div class="game"><canvas id="c" width="1000" height="620"></canvas><div class="hud"><span class="pill">🌌 AYMP COSMIC RUNNER</span><span class="pill" id="level">LEVEL 1</span><span class="pill" id="score">⭐ 0</span><span class="pill" id="best">🏆 0</span><span class="pill" id="power">⚡ —</span></div><div class="hint">👆 Tap / Space — Jump • ⭐ Collect Stars • 💎 Collect Crystals • 🛡️ Power-up • 🔥 Avoid Fire</div><div class="overlay" id="o"><div class="panel"><h1>AYMP Cosmic Runner</h1><p>Run through the cosmic realm, collect stars, use power-ups and survive increasingly difficult levels.</p><button id="start">▶ START ADVENTURE</button></div></div></div><script>(()=>{const c=document.getElementById('c'),ctx=c.getContext('2d'),o=document.getElementById('o'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),levelEl=document.getElementById('level'),powerEl=document.getElementById('power');const W=1000,H=620,ground=520;let p,obs,stars,powers,particles,score,frame,running,last,world,level,shield,boost,best;best=Number(localStorage.getItem('aymp-runner-best')||0);bestEl.textContent='🏆 '+best;function reset(){p={x:150,y:ground-70,w:42,h:70,vy:0,on:true,frame:0};obs=[];stars=[];powers=[];particles=[];score=0;frame=0;world=0;level=1;shield=0;boost=0;running=true;last=performance.now();o.style.display='none';hud();requestAnimationFrame(loop)}function hud(){levelEl.textContent='LEVEL '+level;scoreEl.textContent='⭐ '+score;bestEl.textContent='🏆 '+best;powerEl.textContent=shield>0?'🛡️ SHIELD':boost>0?'⚡ BOOST':'⚡ —'}function jump(){if(running&&p.on){p.vy=-17;p.on=false;burst(p.x+20,p.y+65,10)}}function burst(x,y,n){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:-Math.random()*4-1,a:1,s:2+Math.random()*3})}function spawn(){let gap=Math.max(55,92-level*10);if(frame%gap===0)obs.push({x:W+20,y:ground-42,w:35,h:42});if(level>=2&&frame%(gap+40)===0)obs.push({x:W+20,y:ground-82,w:48,h:82,big:true});if(level>=3&&frame%(gap+25)===0)obs.push({x:W+20,y:ground-125,w:50,h:125,big:true});if(frame%Math.max(40,58-level*4)===0)stars.push({x:W+20,y:ground-100-Math.random()*150,r:12});if(frame%330===0)powers.push({x:W+20,y:ground-150-Math.random()*160,type:Math.random()<.55?'shield':'boost'})}function drawStars(){ctx.fillStyle='#fff';for(let i=0;i<65;i++){let xx=(i*137-world*.12)%W;if(xx<0)xx+=W;let yy=(i*61)%390+20;ctx.globalAlpha=.35+(i%3)*.2;ctx.fillRect(xx,yy,2,2)}ctx.globalAlpha=1}function drawBackground(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#151c55');g.addColorStop(.6,'#080e2b');g.addColorStop(1,'#030612');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);drawStars();for(let i=0;i<4;i++){let x=(i*330-world*.28)%(W+400)-150;ctx.fillStyle='rgba(65,90,180,.18)';ctx.beginPath();ctx.arc(x,260+(i%2)*70,120+i*12,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#0b1030';ctx.fillRect(0,ground,W,H-ground);ctx.strokeStyle='#c9a227';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,ground);ctx.lineTo(W,ground);ctx.stroke();for(let i=0;i<12;i++){let x=(i*110-world*.8)%(W+120);if(x<0)x+=W+120;ctx.fillStyle='#18194b';ctx.fillRect(x,ground+18,70,6)}}function drawPlayer(){let x=p.x+21,y=p.y+25,phase=Math.floor(p.frame/6)%4,runOff=phase===1?-4:phase===3?4:0;ctx.save();ctx.translate(x,y);if(shield>0){ctx.strokeStyle='rgba(100,220,255,.9)';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,40,0,Math.PI*2);ctx.stroke()}ctx.shadowBlur=14;ctx.shadowColor='#56dfff';ctx.fillStyle='#45c9ff';ctx.beginPath();ctx.arc(0,-17,14,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#07152f';ctx.beginPath();ctx.arc(5,-19,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#183e82';ctx.beginPath();ctx.roundRect(-13,-3,27,34,9);ctx.fill();ctx.fillStyle='#d4af37';ctx.fillRect(-4,2,8,23);ctx.strokeStyle='#65dfff';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-11,4);ctx.lineTo(-23,18+runOff);ctx.moveTo(12,4);ctx.lineTo(23,18-runOff);ctx.stroke();ctx.strokeStyle='#9bdfff';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-7,29);ctx.lineTo(-14,52-runOff);ctx.moveTo(7,29);ctx.lineTo(14,52+runOff);ctx.stroke();ctx.strokeStyle='#d4af37';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(19,18-runOff);ctx.lineTo(31,8-runOff);ctx.stroke();ctx.restore()}function drawObjects(){ctx.font='38px sans-serif';obs.forEach(a=>ctx.fillText('🔥',a.x,a.y+34));ctx.font='30px sans-serif';stars.forEach(a=>{ctx.save();ctx.translate(a.x,a.y);ctx.rotate(frame*.04);ctx.fillText('⭐',-15,10);ctx.restore()});ctx.font='32px sans-serif';powers.forEach(a=>ctx.fillText(a.type==='shield'?'🛡️':'⚡',a.x,a.y));particles.forEach(a=>{ctx.globalAlpha=a.a;ctx.fillStyle='#65dfff';ctx.fillRect(a.x,a.y,a.s,a.s)});ctx.globalAlpha=1}function levelCheck(){let newLevel=Math.min(5,1+Math.floor(score/100));if(newLevel!==level){level=newLevel;burst(p.x+20,p.y+20,30);o.style.display='grid';o.querySelector('.panel').innerHTML='<h1>🌟 LEVEL '+level+' UNLOCKED!</h1><p>The cosmic realm is getting harder. Keep running!</p><button id="continue">▶ CONTINUE</button>';document.getElementById('continue').onclick=()=>{o.style.display='none';last=performance.now();requestAnimationFrame(loop)}}}function loop(t){if(!running)return;let dt=Math.min(2,(t-last)/16);last=t;frame++;world+=(boost>0?9:6)*dt;p.frame++;p.vy+=.9*dt;p.y+=p.vy*dt;if(p.y>=ground-70){p.y=ground-70;p.vy=0;p.on=true}if(shield>0)shield-=dt;if(boost>0)boost-=dt;spawn();let speed=(boost>0?9.5:6.8)+level*.45;obs.forEach(a=>a.x-=speed*dt);stars.forEach(a=>a.x-=Math.max(4.5,speed-.8)*dt);powers.forEach(a=>a.x-=speed*dt);particles.forEach(a=>{a.x+=a.vx;a.y+=a.vy;a.vy+=.15;a.a-=.035});obs=obs.filter(a=>a.x>-80);particles=particles.filter(a=>a.a>0);stars=stars.filter(a=>a.x>-50);powers=powers.filter(a=>a.x>-50);for(const a of obs)if(p.x+34>a.x&&p.x<a.x+a.w&&p.y+60>a.y&&p.y<a.y+a.h){if(shield>0){shield=0;burst(a.x,a.y,20);a.x=-200}else{running=false;gameOver();return}}stars=stars.filter(a=>{if(Math.hypot(a.x-(p.x+20),a.y-(p.y+25))<34){score+=10;burst(a.x,a.y,8);return false}return true});powers=powers.filter(a=>{if(Math.hypot(a.x-(p.x+20),a.y-(p.y+25))<42){if(a.type==='shield')shield=500;else boost=500;burst(a.x,a.y,18);return false}return true});if(frame%30===0)score++;if(score>best){best=score;localStorage.setItem('aymp-runner-best',best)}hud();drawBackground();drawObjects();drawPlayer();levelCheck();if(running&&o.style.display==='none')requestAnimationFrame(loop)}function gameOver(){o.style.display='grid';o.querySelector('.panel').innerHTML='<h1>🌌 Adventure Over</h1><p>Your Cosmic Score: <b>'+score+'</b><br>Best Score: <b>'+best+'</b></p><button id="again">↻ PLAY AGAIN</button>';document.getElementById('again').onclick=reset}document.getElementById('start').onclick=reset;addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();jump()}});c.addEventListener('pointerdown',e=>{e.preventDefault();jump()});drawBackground();drawPlayer()})();</script></body></html>
