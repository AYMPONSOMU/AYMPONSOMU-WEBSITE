name: Ensure Siddha Wellness Homepage Link

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-siddha-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Siddha link without changing existing sections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<!-- AYMP_SIDDHA_HOMEPAGE_LINK_V2 -->'
          if marker in text:
              print('Siddha homepage link already present')
              raise SystemExit(0)
          section = '''\n<!-- AYMP_SIDDHA_HOMEPAGE_LINK_V2 -->\n<section id="aymp-siddha-wellness" style="padding:70px 20px;">\n  <div class="container">\n    <div class="free-box" style="text-align:center;">\n      <div style="color:#ffdf6b;letter-spacing:2px;text-transform:uppercase;font-size:13px;font-weight:600;margin-bottom:12px;">AYMPONSOMU • Traditional Siddha Wellness & Research</div>\n      <h2 style="color:#ffd700;font-family:'Cinzel',serif;font-size:clamp(30px,5vw,44px);margin-bottom:18px;">Siddha Wellness Solutions for Men & Women</h2>\n      <p style="max-width:850px;margin:0 auto 25px;color:#ddd;font-size:17px;">Traditional Siddha wisdom, herbal knowledge and holistic wellness guidance for vitality, strength, reproductive wellness, joint wellness and general well-being.</p>\n      <a class="btn" href="siddha-wellness.html">🌿 EXPLORE SIDDHA WELLNESS</a>\n    </div>\n  </div>\n</section>\n'''
          closing = '</body>'
          if closing not in text:
              raise SystemExit('No closing body tag found')
          text = text.replace(closing, section + closing, 1)
          path.write_text(text, encoding='utf-8')
          print('Siddha link added safely before closing body')
          PY

      - name: Commit only homepage addition
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Add Siddha Wellness link to homepage'
            git push
          fi
