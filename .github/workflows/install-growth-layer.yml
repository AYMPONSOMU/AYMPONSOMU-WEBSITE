name: Install AYMP Growth Layer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install-growth-layer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure AYMP growth layers are loaded
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          layers = [
            ('AYMP-GROWTH-LAYER','assets/js/aymp-growth.js?v=6'),
            ('AYMP-DAILY-DISCOVERY-IMAGES','assets/js/aymp-daily-discovery-images.js?v=2'),
            ('AYMP-LIVE-GLOBAL-UPGRADE','assets/js/aymp-live-global-upgrade.js?v=2'),
            ('AYMP-GAME-ZONE-ENTRY','assets/js/aymp-game-entry.js?v=1'),
            ('AYMP-DISCOVERY-WORLD','assets/js/aymp-discovery-world.js?v=1'),
            ('AYMP-TOKEN-ECONOMY','assets/js/aymp-token-economy.js?v=1'),
            ('AYMP-AUTO-GLOBAL-SHARING','assets/js/aymp-auto-global-sharing-v1.js?v=1'),
          ]
          # Remove managed layer tags, including the old homepage-only daily content layer.
          old = ('AYMP-GLOBAL-DAILY-CONTENT','assets/js/aymp-global-daily-content.js')
          text = re.sub(r'\s*<!-- '+re.escape(old[0])+r' -->\s*<script src="'+re.escape(old[1])+r'\?v=[^"]+"></script>', '', text)
          for marker, src in layers:
            text = re.sub(r'\s*<!-- '+re.escape(marker)+r' -->\s*<script src="'+re.escape(src.split('?')[0])+r'\?v=[^"]+"></script>', '', text)
          # Repair the two malformed horoscope anchors without changing their destination or visible text.
          text = text.replace('<a class="btn" <a href="daily-horoscope.html" class="gold-button">', '<a class="btn" href="daily-horoscope.html">')
          text = text.replace('<a class="btn" <a href="weekly-horoscope.html" class="gold-button">', '<a class="btn" href="weekly-horoscope.html">')
          tags = ''.join('\n  <!-- '+m+' -->\n  <script src="'+src+'"></script>\n' for m,src in layers)
          if '</body>' in text:
            text = text.replace('</body>', tags + '</body>', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit and push homepage integration
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "AYMP layers already installed and homepage needs no repair."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@github.com"
          git add index.html
          git commit -m "Repair malformed homepage horoscope links"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
